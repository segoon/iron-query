name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev clang-format

      - name: Test (gcc)
        if: matrix.compiler == 'gcc'
        run: CXX=g++ make test

      - name: Test (clang)
        if: matrix.compiler == 'clang'
        run: CXX=clang++ make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev clang-format clang-tidy

      - name: clang-format
        run: make format-check

      - name: clang-tidy
        run: make tidy

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev

      - name: Test
        run: make sanitize

  required:
    if: always()
    needs: [build-and-test, lint, sanitizers]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
